name: NAVO checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: JavaScript syntax
        run: |
          for f in public/*.js; do node --check "$f"; done
      - name: Python syntax
        run: python -m py_compile api/*.py
      - name: Core rule tests
        run: |
          for t in cases-core client-core field-review-core portfolio-map-core client-assurance-core; do
            node "tests/$t.cjs"
          done
      - name: Python dependencies
        run: pip install -r requirements.txt
      - name: AI and client tests
        run: python -I tests/client-ai.py
      - name: Email automation and Excel import tests
        run: |
          python -I tests/notify.py
          python -I tests/excel-import.py
          python -I tests/users-api.py
          python -I tests/ceo-import.py
      - name: Database access by organisation level
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          cd tests && npm ci --ignore-scripts && node scope-sql.cjs
      - name: Whole app in a real browser (admin, division manager, site worker; desktop and phone)
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null
          npm i --no-save playwright@1.56.0 > install.log 2>&1 || { echo "::error::npm install of playwright failed: $(tail -3 install.log | tr '\n' ' ')"; exit 1; }
          npx playwright install --with-deps chromium > browser.log 2>&1 || { echo "::error::browser install failed: $(tail -3 browser.log | tr '\n' ' ')"; exit 1; }
          cd "$GITHUB_WORKSPACE" && PLAYWRIGHT_PATH=/tmp/pw/node_modules/playwright node tests/e2e/app.cjs
