name: Uptime check
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Site and database respond
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o body.json -w "%{http_code}" --max-time 20 https://navo-hse.vercel.app/api/health || echo 000)
            if [ "$code" = "200" ]; then cat body.json; exit 0; fi
            echo "Attempt $i: HTTP $code"; cat body.json 2>/dev/null; sleep 30
          done
          echo "::error::NAVO is down or cannot reach the database"; exit 1
      - name: Report exports respond
        if: always()
        run: |
          fail=0
          for f in pdf pptx docx xlsx; do
            code=$(curl -s -o out.$f -w "%{http_code} %{size_download}B %{time_total}s" --max-time 70 -X POST "https://navo-hse.vercel.app/api/report?fmt=$f" -H "Content-Type: application/json" -d '{"title":"Uptime","month":"2026-10","projects":[],"sections":[]}' || echo 000)
            body=$(head -c 400 out.$f | tr -d '\n\r' | tr -c '[:print:]' ' '); case "$code" in 200*) echo "::notice::$f $code";; *) echo "::error::$f $code $body"; fail=1;; esac
          done
          exit $fail
