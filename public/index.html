<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>NAVO HSE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app shell — sidebar on desktop, bottom tab bar on phone; worker view is a single-column big-button flow */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface2:#e9eeec; --fg:#14201d; --muted:#5d6b67; --line:#d5ddda;
  --brand:#0f4c45; --brand-fg:#ffffff; --accent:#e8a317;
  --ok:#2f8a57; --warn:#c77a0a; --crit:#c2392f; --info:#2d6aa6;
  --ok-bg:#e3f2e9; --warn-bg:#fbefd9; --crit-bg:#f8e2df; --info-bg:#e1ecf7;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1514; --surface:#16201e; --surface2:#1e2a28; --fg:#e6eeec; --muted:#93a39f; --line:#2a3836;
  --brand:#2f9c8c; --brand-fg:#06110f; --accent:#f0b437;
  --ok:#5cc286; --warn:#e7a23b; --crit:#ef6b5f; --info:#6aa6e0;
  --ok-bg:#163223; --warn-bg:#3a2a0f; --crit-bg:#3d1a17; --info-bg:#162a3d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1514; --surface:#16201e; --surface2:#1e2a28; --fg:#e6eeec; --muted:#93a39f; --line:#2a3836;
  --brand:#2f9c8c; --brand-fg:#06110f; --accent:#f0b437;
  --ok:#5cc286; --warn:#e7a23b; --crit:#ef6b5f; --info:#6aa6e0;
  --ok-bg:#163223; --warn-bg:#3a2a0f; --crit-bg:#3d1a17; --info-bg:#162a3d; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
aside{background:var(--brand);color:var(--brand-fg);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{font:700 30px/1 var(--f-display);letter-spacing:.06em;display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo b{display:inline-grid;place-items:center;width:34px;height:34px;background:var(--accent);color:#14201d;border-radius:8px;font-size:22px}
.logo small{display:block;font:500 11px var(--f-body);letter-spacing:.12em;opacity:.75;text-transform:uppercase}
.nav button{all:unset;display:flex;gap:10px;align-items:center;width:100%;box-sizing:border-box;padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:500;opacity:.82}
.nav button:hover{background:rgba(255,255,255,.08);opacity:1}
.nav button[aria-current="true"]{background:rgba(255,255,255,.16);opacity:1;box-shadow:inset 3px 0 0 var(--accent)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .sec{font-size:11px;text-transform:uppercase;letter-spacing:.12em;opacity:.55;padding:14px 12px 4px}
.ico{width:18px;height:18px;flex:none}
main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top h1{font:600 24px/1.1 var(--f-display);letter-spacing:.02em;margin:0;text-wrap:balance}
.crumb{font-size:12px;color:var(--muted)}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,.seg{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.seg{display:inline-flex;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:6px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.wrap{padding-block:22px;padding-inline:24px;display:flex;flex-direction:column;gap:18px;max-width:1240px;width:100%}
.demo{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.demo span{background:var(--warn-bg);color:var(--warn);font-weight:600;padding:2px 8px;border-radius:99px;letter-spacing:.04em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.kpi .v{font:600 34px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi.alert .v{color:var(--crit)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.panel h2{font:600 18px/1.2 var(--f-display);letter-spacing:.03em;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 small{font:400 12px var(--f-body);color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:150px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.bar .t{height:14px;background:var(--surface2);border-radius:3px;overflow:hidden;display:flex}
.bar .t i{display:block;height:100%}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.countries{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cty{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.cty b{font:600 20px var(--f-display);letter-spacing:.04em}
.cty .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.cty .row span:last-child{color:var(--fg);font-family:var(--f-mono)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
.id{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;letter-spacing:.03em;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-crit{background:var(--crit-bg);color:var(--crit)}.p-info{background:var(--info-bg);color:var(--info)}.p-mute{background:var(--surface2);color:var(--muted)}
.sev{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500}
.btn.pri{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.btn.acc{background:var(--accent);color:#14201d;border-color:var(--accent);font-weight:600}
.feed{display:flex;flex-direction:column}
.feed div{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:start;font-size:13px}
.feed div:last-child{border:0}
.feed small{color:var(--muted);display:block}
/* detail */
.det-head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-start}
.det-head h2{font:600 26px/1.15 var(--f-display);margin:4px 0;text-wrap:balance}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.facts div{background:var(--surface2);border-radius:8px;padding:8px 10px}
.facts span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.wheel{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wheel div{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;text-align:center;color:var(--muted)}
.wheel div.on{border-color:var(--crit);background:var(--crit-bg);color:var(--crit);font-weight:600}
.seq{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
/* worker */
.phone{max-width:430px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.hello{background:var(--brand);color:var(--brand-fg);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:4px}
.hello b{font:600 26px var(--f-display)}
.hello small{opacity:.8}
.net{display:inline-flex;gap:6px;align-items:center;font-size:12px;background:rgba(255,255,255,.14);padding:3px 10px;border-radius:99px;width:max-content}
.net i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.big{display:flex;gap:14px;align-items:center;padding:18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;font-size:17px;font-weight:600;width:100%}
.big .ic{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;flex:none}
.big small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.steps{display:flex;gap:4px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--surface2)}.steps i.on{background:var(--accent)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:16px 10px;font-weight:600;font-size:15px;min-height:72px}
.choice button[aria-pressed="true"]{border-color:var(--brand);background:var(--surface2)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-weight:600;font-size:13px}
.fld select,.fld textarea,.fld input[type=text]{width:100%;padding:12px;border-radius:10px;font-size:15px;background:var(--surface);border:1px solid var(--line)}
.photo{border:2px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted);display:block;cursor:pointer}
.photo img{border-radius:8px;max-height:180px;margin:0 auto}
.wbtns{display:flex;gap:10px}.wbtns .btn{flex:1;padding:14px;font-size:16px;border-radius:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:500;z-index:50;max-width:calc(100% - 32px)}
.tabbar{display:none}
aside{overflow-y:auto}
.nav button .soon{margin-left:auto;font-size:10px;opacity:.6;letter-spacing:.06em}
.flow{display:flex;gap:0;overflow-x:auto;padding-bottom:4px}
.flow div{flex:1;min-width:110px;position:relative;padding:10px 8px 8px;text-align:center;font-size:12px;color:var(--muted)}
.flow div::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:var(--surface2)}
.flow div.done::before{background:var(--ok)}.flow div.cur::before{background:var(--accent)}
.flow div.cur{color:var(--fg);font-weight:600}.flow div.done{color:var(--fg)}
.flow b{display:block;font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--muted)}
.appr{display:flex;flex-direction:column;gap:8px}
.appr div{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.appr small{display:block;color:var(--muted)}
.trail{font-size:12px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.trail span{color:var(--fg)}
.ck{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.ck:last-child{border:0}
.ck .opt{display:flex;gap:4px}
.ck .opt button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.ck .opt button[aria-pressed="true"].y{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.ck .opt button[aria-pressed="true"].n{background:var(--crit-bg);color:var(--crit);border-color:var(--crit)}
.ck .opt button[aria-pressed="true"].na{background:var(--surface2);color:var(--fg)}
.score{font:600 40px/1 var(--f-display);font-variant-numeric:tabular-nums}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.plan div{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.mon{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.ov-in{width:90px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);text-align:right}
.links{display:flex;flex-wrap:wrap;gap:6px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:9px 14px;white-space:nowrap;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.subtabs,.chips{display:flex;flex-wrap:wrap;gap:6px}
.subtabs button,.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:500;color:var(--muted)}
.subtabs button[aria-pressed="true"],.chips button[aria-pressed="true"]{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.r{text-align:right}.num{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
td.bad{color:var(--crit);font-weight:600;background:var(--crit-bg)}
tr.sec td{background:var(--surface2);font-weight:600}
table.mx td,table.mx th{padding:6px 8px;font-size:12px}
table.mx td:first-child{position:sticky;left:0;background:var(--surface);min-width:220px}
table.mx tr.sec td:first-child{background:var(--surface2)}
.score-cell{display:inline-block;min-width:46px;text-align:center;color:#fff;font-weight:600;border-radius:4px;padding:2px 6px;font-family:var(--f-mono);font-size:12px}
.flag{color:var(--crit)}
.meter{display:inline-block;position:relative;width:calc(100% - 50px);height:10px;background:var(--surface2);border-radius:3px;vertical-align:middle;margin-right:8px}
.meter i{display:block;height:100%;border-radius:3px}.meter b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg)}
.bar.wide{grid-template-columns:minmax(0,240px) 1fr 34px}
.pyr{display:flex;flex-direction:column;gap:3px}
.pr{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;font-size:12px}
.pb{justify-self:center;text-align:center;color:#fff;font-family:var(--f-mono);font-size:11px;padding:3px 0;border-radius:2px;min-width:44px}
.pr .pl{color:var(--muted)}
.pk{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}.pk i{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:2px}
.dn{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.dl{display:flex;flex-direction:column;gap:6px;font-size:12px;min-width:0}
.dl span{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center}.dl i{width:10px;height:10px;border-radius:2px}.dl b{font-family:var(--f-mono);font-weight:500}
.tree{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px}
.tcol{min-width:220px;display:flex;flex-direction:column;gap:4px}
.tcol .th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:2px 4px}
.tn{display:grid;grid-template-columns:1fr 70px 42px;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;text-align:left;font-size:12px}
.tn .tb{height:8px;background:var(--surface2);border-radius:2px;overflow:hidden}.tn .tb i{display:block;height:100%;background:var(--info)}
.tn b{font-family:var(--f-mono);font-weight:500;text-align:right}
.tn[aria-pressed="true"]{border-color:var(--brand);background:var(--surface2);font-weight:600}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
@media (max-width:860px){.kgrid{grid-template-columns:1fr}.bar.wide{grid-template-columns:minmax(0,140px) 1fr 30px}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  .grid2{grid-template-columns:1fr}
  .top{padding:12px 16px}
  .wrap{padding-inline:16px;padding-bottom:90px}
  .countries{grid-template-columns:1fr}
  .bar{grid-template-columns:110px 1fr 30px}
  .wheel{grid-template-columns:repeat(2,1fr)}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20;justify-content:space-around}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 6px}
  .tabbar button[aria-current="true"]{color:var(--brand);font-weight:600}
  .hide-m{display:none}
}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .2s ease}@keyframes fade{from{opacity:.4;transform:translateY(4px)}}}
</style>

const IC={
dash:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',

  const ok=hi?a>=t:a<=t;const sc=ok?mx:+(mx*(hi?Math.max(0,Math.min(1,t?a/t:0)):Math.max(0,1-(a-t)/(t+4)))).toFixed(1);st+=sc;return{n,u,t,mx,a,sc,ok}});qs+=st;return{sec,st:+st.toFixed(1),max:inds.reduce((s,i)=>s+i[3],0),ir}});

 (L.unsubs||[]).forEach(u=>u());L.unsubs=[];COLS.forEach(([c,k])=>L[k]=[]);if(!role)return;
 COLS.forEach(([c,k,views])=>{const parts={};const merge=()=>{L[k]=Object.values(parts).flat();if(k==="reports")L[k].sort((a,b)=>b.ts-a.ts);if(views.includes(st.view))render()};

function exec(){const g=liveGate();if(g)return g;if(myRole()==="worker")return liveTag()+`<div class="panel"><h2>Executive dashboards are for supervisors, HSE and leadership</h2></div>`;
 const m=L.scMonth||thisMonth();const lv=st.lvl||{};const P=execScope();const k=levelMetrics(P,m),pk=levelMetrics(P,prevMonth(m));
 const levelName=lv.project?projName(lv.project):lv.division!=null&&lv.division!==undefined?lv.division:lv.platform||"Overall";
 const tier=lv.project?"Project":lv.division!=null&&lv.division!==undefined?"Division":lv.platform?"Platform":"Executive";
 const crumbs=[["Overall",{}]];if(lv.platform)crumbs.push([lv.platform,{platform:lv.platform}]);if(lv.division!=null&&lv.division!==undefined)crumbs.push([lv.division,{platform:lv.platform,division:lv.division}]);if(lv.project)crumbs.push([projName(lv.project),lv]);
 const delta=(a,b,good)=>a==null||b==null||a===b?"":`<span style="color:${(a>b)===good?"var(--ok)":"var(--crit)"}">${a>b?"▲":"▼"} ${Math.abs(+(a-b).toFixed(1))}</span> vs last month`;
 const kids=execChildren(P).map(c=>({...c,k:levelMetrics(c.P,m)}));const months=lastMonths(m,6);
 const st6=s=>s==null?"":TRND[statusFor(s,null)]?`<span class="pill ${TRND[statusFor(s,null)][0]}">${statusFor(s,null)}</span>`:"";
 const cats=WHEEL.map(w=>[w,k.R.filter(r=>r.cat===w).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);
 return liveTag()+`<div class="filters" style="align-items:center"><div class="chips">${crumbs.map(([n,key],i)=>`<button data-lvl='${esc(JSON.stringify(key))}' aria-pressed="${i===crumbs.length-1}">${esc(n)}</button>`).join('<span style="color:var(--muted)">›</span>')}</div><div style="flex:1"></div><input id="sc-month2" type="month" value="${m}" class="mon" aria-label="Month"></div>
 <div class="panel" style="flex-direction:row;flex-wrap:wrap;align-items:center;gap:20px"><div style="flex:1;min-width:240px"><span class="pill p-info">${tier} dashboard</span><h2 style="font-size:30px;margin-top:6px">${esc(levelName)}</h2><small style="color:var(--muted)">${k.projects} project${k.projects===1?"":"s"} · ${k.headcount.toLocaleString()} workers · generated from live records for ${m}</small></div>
 <div style="text-align:right"><div class="score" style="color:${k.score==null?"var(--muted)":hcol(k.score)}">${k.score??"—"}</div><small style="color:var(--muted)">Average site health</small><div>${st6(k.score)}</div></div></div>
 <div class="kpis">
 <div class="kpi"><span class="l">Reports</span><span class="v">${k.reports}</span><span class="d">${delta(k.reports,pk.reports,true)||"&nbsp;"}</span></div>
 <div class="kpi"><span class="l">Near misses</span><span class="v">${k.nearMiss}</span><span class="d">${delta(k.nearMiss,pk.nearMiss,true)||"&nbsp;"}</span></div>
 <div class="kpi ${k.incidents?"alert":""}"><span class="l">Incidents</span><span class="v">${k.incidents}</span><span class="d">${k.openInv} open &gt; 14 days</span></div>
 <div class="kpi"><span class="l">Action closure on time</span><span class="v">${k.closure==null?"—":k.closure+"%"}</span><span class="d">${k.overdue} overdue</span></div>
 <div class="kpi"><span class="l">Inspections</span><span class="v">${k.insp}</span><span class="d">${k.atRisk==null?"no items yet":k.atRisk+"% items at risk"}</span></div>
 <div class="kpi"><span class="l">Leadership walkthroughs</span><span class="v">${k.walks}${k.plan?` / ${k.plan}`:""}</span><span class="d">${k.walkPct==null?"no plan set":k.walkPct+"% of plan"}</span></div></div>
 ${kids.length?`<div class="panel"><h2>${tier==="Executive"?"By platform":tier==="Platform"?"By division":"By project"} <small>tap a row to open its dashboard</small></h2><div class="tbl"><table><thead><tr><th>${tier==="Executive"?"Platform":tier==="Platform"?"Division":"Project"}</th><th class="r">Projects</th><th class="r">Reports</th><th class="r">Incidents</th><th class="r">Closure</th><th class="r">Overdue</th><th class="r">Walkthroughs</th><th class="r">Health</th></tr></thead><tbody>
 ${kids.map(c=>`<tr class="click" data-lvl='${esc(JSON.stringify(c.key))}'><td><b>${esc(c.name)}</b></td><td class="r num">${c.k.projects}</td><td class="r num">${c.k.reports}</td><td class="r num">${c.k.incidents}</td><td class="r num">${c.k.closure==null?"—":c.k.closure+"%"}</td><td class="r num ${c.k.overdue?"bad":""}">${c.k.overdue}</td><td class="r num">${c.k.walks}${c.k.plan?" / "+c.k.plan:""}</td><td class="r">${c.k.score==null?"—":`<span class="score-cell" style="background:${hcol(c.k.score)}">${c.k.score}</span>`}</td></tr>`).join("")}</tbody></table></div></div>`:`<div class="filters"><button class="btn pri" data-scd2="${esc(lv.project)}">Open full score card</button></div>`}
 <div class="grid2"><div class="panel"><h2>Reports, last 6 months</h2>${vbars(months.map(mm=>levelMetrics(P,mm).reports),months.map(mLabel),{color:"var(--brand)"})}</div>
 <div class="panel"><h2>High-energy categories <small>${m}</small></h2>${cats.length?`<div class="bars">${cats.map(([w,n])=>`<div class="bar"><span>${w}</span><span class="t"><i style="width:${n/cats[0][1]*100}%;background:var(--crit)"></i></span><span class="n">${n}</span></div>`).join("")}</div>`:`<p style="margin:0;color:var(--muted)">No high-energy events reported this month.</p>`}</div></div>
 <div class="grid2"><div class="panel"><h2>Average site health, last 6 months</h2>${vbars(months.map(mm=>{const s=levelMetrics(P,mm).score;return s??0}),months.map(mLabel),{color:v=>hcol(v),target:80})}</div>
 <div class="panel"><h2>Report mix <small>${m}</small></h2>${donut([["Incidents",k.incidents,"var(--crit)"],["Hazards",k.hazards,"var(--warn)"],["Good practice",k.good,"var(--ok)"]],String(k.reports),"reports")}</div></div>`;}

/* ---- Leadership proactive engagement ---- */
function leaders(){const g=liveGate();if(g)return g;const m=L.scMonth||thisMonth();
 const ids=new Set(myProjects().map(p=>p.id));const people=Object.entries(L.members).filter(([,x])=>x.leader);
 const row=([uid,x])=>{const V=L.activities.filter(v=>v.by===uid&&inMonth(v.date,m)&&ids.has(v.project));const walks=V.filter(v=>v.type==="Leadership walkthrough").reduce((s,v)=>s+(+v.count||1),0);
  const tbt=V.filter(v=>v.type==="Toolbox talk").reduce((s,v)=>s+(+v.count||1),0);const rep=L.reports.filter(r=>r.by===uid&&inMonth(r.ts,m)).length;
  const act=L.actions.filter(a=>a.by===uid&&inMonth(a.ts,m)).length;const ins=L.inspections.filter(i=>i.by===uid&&inMonth(i.ts,m)).length;
  const t=+x.walkTarget||0;const pct=t?Math.round(walks/t*100):null;const status=pct==null?["No target","p-mute"]:pct>=100?["On track","p-ok"]:pct>=50?["Behind","p-warn"]:["Not engaged","p-crit"];
  const score=walks*3+ins*2+act+rep+tbt;return{uid,x,walks,tbt,rep,act,ins,t,pct,status,score}};
 const rows=people.map(row).sort((a,b)=>b.score-a.score);const me=L.members[L.me.id]?.leader?row([L.me.id,L.members[L.me.id]]):null;
 return liveTag()+`<div class="filters"><input id="sc-month2" type="month" value="${m}" class="mon" aria-label="Month"></div>
 ${me?`<div class="panel"><h2>My engagement · ${m}</h2><div class="kpis"><div class="kpi"><span class="l">Walkthroughs</span><span class="v">${me.walks}${me.t?" / "+me.t:""}</span><span class="d"><span class="pill ${me.status[1]}">${me.status[0]}</span></span></div><div class="kpi"><span class="l">Inspections</span><span class="v">${me.ins}</span></div><div class="kpi"><span class="l">Actions raised</span><span class="v">${me.act}</span></div><div class="kpi"><span class="l">Reports</span><span class="v">${me.rep}</span></div><div class="kpi"><span class="l">Toolbox talks</span><span class="v">${me.tbt}</span></div></div><div class="filters"><button class="btn acc" data-go="activity">Log a walkthrough</button></div></div>`:""}
 <div class="kpis"><div class="kpi"><span class="l">Leaders tracked</span><span class="v">${rows.length}</span></div><div class="kpi"><span class="l">On track</span><span class="v" style="color:var(--ok)">${rows.filter(r=>r.status[0]==="On track").length}</span></div><div class="kpi"><span class="l">Behind</span><span class="v" style="color:var(--warn)">${rows.filter(r=>r.status[0]==="Behind").length}</span></div><div class="kpi ${rows.some(r=>r.status[0]==="Not engaged")?"alert":""}"><span class="l">Not engaged</span><span class="v">${rows.filter(r=>r.status[0]==="Not engaged").length}</span></div><div class="kpi"><span class="l">Walkthroughs</span><span class="v">${rows.reduce((s,r)=>s+r.walks,0)}</span><span class="d">of ${rows.reduce((s,r)=>s+r.t,0)} planned</span></div></div>
 <div class="panel">${rows.length?`<h2>Leadership engagement <small>visible activity in your projects · ${m}</small></h2><div class="tbl"><table><thead><tr><th>Leader</th><th>Role</th><th class="r">Walkthroughs</th><th class="r">Inspections</th><th class="r">Actions raised</th><th class="r">Reports</th><th class="r">Toolbox talks</th><th>Status</th></tr></thead><tbody>
 ${rows.map(r=>`<tr><td class="uname" data-uid="${esc(r.uid)}">…</td><td>${ROLES[r.x.role]||""}</td><td class="r num">${r.walks}${r.t?" / "+r.t:""}</td><td class="r num">${r.ins}</td><td class="r num">${r.act}</td><td class="r num">${r.rep}</td><td class="r num">${r.tbt}</td><td><span class="pill ${r.status[1]}">${r.status[0]}</span></td></tr>`).join("")}</tbody></table></div>`:`<h2>No leaders tracked yet</h2><p style="margin:0;color:var(--muted)">On Projects &amp; access, mark people as leaders and set their monthly walkthrough target. Their walkthroughs, inspections and actions then appear here automatically.</p>`}</div>`;}

/* ---- Projects & access ---- */
function access(){const g=liveGate();if(g)return g;if(myRole()!=="admin")return liveTag()+`<div class="panel"><h2>Only HSE Admins manage projects and access</h2><p style="margin:0;color:var(--muted)">Your projects: ${myProjects().map(p=>esc(p.name)).join(", ")||"none"}.</p></div>`;
 const M=Object.entries(L.members);const a=L.acc;
 return liveTag()+`<div class="grid2"><div class="panel"><h2>Projects <small>${L.projects.length}</small></h2>
 <div class="filters"><input id="np-name" type="text" placeholder="Project name, e.g. Jubail Tank Farm" style="flex:1;min-width:180px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)"><select id="np-cty"><option>KSA</option><option>Egypt</option><option>Bahrain</option></select><select id="np-plat"><option>Construction</option><option>Non-Construction</option></select><input id="np-div" type="text" placeholder="Division, e.g. Power" style="min-width:150px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)"><button class="btn pri" id="np-add">Add project</button></div><p style="margin:0;font-size:12px;color:var(--muted)">Headcount and monthly plans drive the automatic score. Edit them in the table any time.</p>
 ${L.projects.length?`<div class="tbl"><table><thead><tr><th>Project</th><th>Country</th><th>Platform</th><th>Division</th><th class="r">Headcount</th><th class="r">Inspections / month</th><th class="r">Walkthroughs / month</th><th class="r">People</th><th></th></tr></thead><tbody>${L.projects.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.country)}</td><td><select class="pe-in" data-t="text" data-pid="${esc(p.id)}" data-f="platform" aria-label="Platform">${PLATFORMS.map(x=>`<option ${(p.platform||"Construction")===x?"selected":""}>${x}</option>`).join("")}</select></td><td><input class="pe-in" data-t="text" data-pid="${esc(p.id)}" data-f="division" type="text" value="${esc(p.division||"")}" placeholder="Division" aria-label="Division" style="width:130px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface)"></td>${["headcount","planInsp","planWalk"].map(f=>`<td class="r"><input class="pe-in ov-in" data-pid="${esc(p.id)}" data-f="${f}" type="number" min="0" value="${esc(p[f]??"")}" aria-label="${f}"></td>`).join("")}<td class="r num">${M.filter(([,m])=>m.role==="admin"||m.projects?.includes(p.id)).length}</td><td class="r"><button class="btn" data-delp="${esc(p.id)}">Remove</button></td></tr>`).join("")}</tbody></table></div>`:`<p style="margin:0;color:var(--muted)">No projects yet. Add your first one above.</p>`}</div>
 <div class="panel"><h2>Add a person</h2>
 <div class="fld"><label for="acc-q">Search by name</label><input id="acc-q" type="text" autocomplete="off" placeholder="Start typing a name" value="${esc(a.q)}" style="padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)"></div>
 <div id="acc-hits" class="appr"></div>
 ${a.pick?`<div class="fld"><label>Role for <b class="uname" data-uid="${esc(a.pick)}">…</b></label><div class="choice">${Object.entries(ROLES).map(([k,v])=>`<button data-role="${k}" aria-pressed="${a.role===k}">${v}</button>`).join("")}</div></div>
 ${a.role&&a.role!=="admin"?`<div class="fld"><label>Projects they can see</label><div class="chips">${L.projects.map(p=>`<button data-pp="${esc(p.id)}" aria-pressed="${(a.projects||[]).includes(p.id)}">${esc(p.name)}</button>`).join("")}</div></div>`:""}
 <div class="fld"><label>Leadership engagement</label><div class="filters" style="align-items:center"><div class="choice" style="flex:1"><button data-lead="1" aria-pressed="${!!a.leader}">Track as leader</button><button data-lead="0" aria-pressed="${!a.leader}">Not a leader</button></div>${a.leader?`<input id="acc-wt" type="number" min="0" value="${esc(a.walkTarget??"")}" placeholder="Walkthroughs / month" aria-label="Monthly walkthrough target" style="width:200px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)">`:""}</div></div>
 <button class="btn acc" id="acc-save" ${a.role&&(a.role==="admin"||(a.projects||[]).length)?"":"disabled"}>Give access</button>`:""}
 <p style="margin:0;font-size:12px;color:var(--muted)">Send them the NAVO link. They create an account with their email, then appear here when you search their name.</p></div></div>
 <div class="panel"><h2>People with access <small>${M.length}</small></h2>${M.length?`<div class="tbl"><table><thead><tr><th>Person</th><th>Role</th><th>Projects</th><th></th></tr></thead><tbody>${M.map(([id,m])=>`<tr><td class="uname" data-uid="${esc(id)}">…</td><td>${ROLES[m.role]}${m.leader?` <span class="pill p-info">Leader${m.walkTarget?" · "+m.walkTarget+"/mo":""}</span>`:""}</td><td>${m.role==="admin"?"All projects":(m.projects||[]).map(p=>esc(projName(p))).join(", ")}</td><td class="r"><button class="btn" data-edm="${esc(id)}">Edit</button> <button class="btn" data-delm="${esc(id)}">Remove</button></td></tr>`).join("")}</tbody></table></div>`:`<p style="margin:0;color:var(--muted)">Only you so far. Search a colleague above to add them.</p>`}</div>`;}

async function fillNames(){if(!L.user)return;const els=[...document.querySelectorAll(".uname[data-uid]")];const ids=[...new Set(els.map(e=>e.dataset.uid).filter(Boolean))];if(!ids.length)return;
 const ps=await L.user.profiles(ids);els.forEach(e=>{const p=ps[e.dataset.uid];e.textContent=p?.isMe?(p.name||"you")+" (you)":(p?.name||"Someone")})}
async function showHits(q){const box=document.getElementById("acc-hits");if(!box)return;const hits=await L.user.search(q);box.replaceChildren(...hits.slice(0,6).map(h=>{const d=document.createElement("div");const s=document.createElement("span");s.textContent=h.name+(h.isMe?" (you)":"");const b=document.createElement("button");b.className="btn";b.textContent="Select";b.dataset.pick=h.id;d.append(s,b);return d}))}
async function saveMembers(map){await L.db.doc("admin/members").set({map})}
async function liveSave(fn,ok){try{await fn();if(ok)toast(ok)}catch(e){toast(e?.code==="invalid_argument"?"You do not have permission to save this. Ask your HSE Admin to add you to this project.":e?.code==="quota_exceeded"?"Storage is full. Remove old records and try again.":"Could not save. Check your connection and try again.")}}

document.addEventListener("click",async e=>{const t=e.target.closest("button,tr");if(!t)return;
 if(t.dataset.close){const r=L.reports.find(x=>x.id===t.dataset.close);await liveSave(()=>L.db.doc("reports/"+r.id).update({status:r.status==="Closed"?"Open":"Closed"}));return}
 if(t.dataset.q!==undefined){const k=L.scProj+"_"+L.scMonth;L.draft[k].qual[+t.dataset.q]=+t.dataset.v;render();return}
 if(t.id==="rv-save"){const k=L.scProj+"_"+L.scMonth;const d=L.draft[k];const ov=Object.fromEntries(Object.entries(d.override).filter(([,v])=>v!==""&&v!=null).map(([a,v])=>[a,+v]));
  if(Object.keys(ov).length&&!d.note.trim()){toast("Write a reason for the overrides first");return}
  await liveSave(()=>L.db.collection("admin/rv/months").doc(k).set({override:ov,admin:Object.fromEntries(Object.entries(d.admin).filter(([,v])=>v!==""&&v!=null).map(([a,v])=>[a,+v])),qual:d.qual,note:d.note.trim(),by:L.me.id,ts:Date.now()}),"Review saved");delete L.draft[k];return}
 if(t.dataset.ract){const r=L.reports.find(x=>x.id===t.dataset.ract);L.af={report:r.id,project:r.project,title:"Follow up: "+(r.desc||r.kind||r.rt).slice(0,80)};go("lactions");return}
 if(t.id==="af-add"){const g=id=>document.getElementById(id).value;const title=g("af-title").trim();if(!title){toast("Describe the action first");return}const due=g("af-due");
  await liveSave(()=>L.db.collection("actions").add({title,project:g("af-proj"),owner:g("af-owner").trim(),due:due?new Date(due+"T23:59").getTime():null,priority:g("af-pri"),report:L.af.report||null,ts:Date.now(),by:L.me.id,closedAt:null}),"Action added");L.af={};return}
 if(t.dataset.aclose){const a=L.actions.find(x=>x.id===t.dataset.aclose);await liveSave(()=>L.db.doc("actions/"+a.id).update({closedAt:a.closedAt?null:Date.now()}));return}
 if(t.id==="lv-add"){const g=id=>document.getElementById(id).value;await liveSave(()=>L.db.collection("activities").add({type:g("lv-type"),project:g("lv-proj"),date:new Date(g("lv-date")+"T12:00").getTime(),count:Math.max(1,+g("lv-count")||1),by:L.me.id,ts:Date.now()}),"Logged");return}
 if(t.dataset.lvl){st.lvl=JSON.parse(t.dataset.lvl);render();window.scrollTo(0,0);return}
 if(t.dataset.scd2){go("sc");st.scd=t.dataset.scd2;render();return}
 if(t.dataset.scd){st.scd=t.dataset.scd;render();return}
 if(t.id==="scd-back"){st.scd=null;render();return}
 if(t.id==="np-add"){const n=document.getElementById("np-name").value.trim();if(!n){toast("Type a project name first");return}const c=document.getElementById("np-cty").value;
  const id="p"+Date.now().toString(36);const pl=document.getElementById("np-plat").value,dv=document.getElementById("np-div").value.trim();await liveSave(()=>L.db.doc("admin/projects").set({list:[...L.projects,{id,name:n,country:c,platform:pl,division:dv}]}),"Project added");return}
 if(t.dataset.delp){if(t.dataset.confirm!=="1"){t.dataset.confirm="1";t.textContent="Confirm remove";return}await liveSave(()=>L.db.doc("admin/projects").set({list:L.projects.filter(p=>p.id!==t.dataset.delp)}),"Project removed");return}
 if(t.dataset.pick){L.acc.pick=t.dataset.pick;const ex=L.members[t.dataset.pick];L.acc.role=ex?.role||null;L.acc.leader=!!ex?.leader;L.acc.walkTarget=ex?.walkTarget??"";L.acc.projects=[...(ex?.projects||[])];render();return}
 if(t.dataset.role){L.acc.role=t.dataset.role;render();return}
 if(t.dataset.pp){const s=new Set(L.acc.projects||[]);s.has(t.dataset.pp)?s.delete(t.dataset.pp):s.add(t.dataset.pp);L.acc.projects=[...s];render();return}
 if(t.dataset.lead!==undefined){const wt=document.getElementById("acc-wt");if(wt)L.acc.walkTarget=wt.value;L.acc.leader=t.dataset.lead==="1";render();return}
 if(t.id==="acc-save"){const a=L.acc;const wt=document.getElementById("acc-wt");if(wt)a.walkTarget=wt.value;await liveSave(()=>saveMembers({...L.members,[a.pick]:{role:a.role,projects:a.role==="admin"?[]:a.projects,leader:!!a.leader,walkTarget:a.leader&&a.walkTarget!==""&&a.walkTarget!=null?+a.walkTarget:null}}),"Access saved");L.acc={q:"",hits:[],pick:null};return}
 if(t.dataset.edm){const m=L.members[t.dataset.edm];L.acc={q:"",pick:t.dataset.edm,role:m.role,projects:[...(m.projects||[])],leader:!!m.leader,walkTarget:m.walkTarget??""};render();window.scrollTo(0,0);return}
 if(t.dataset.delm){if(t.dataset.confirm!=="1"){t.dataset.confirm="1";t.textContent="Confirm";return}const m={...L.members};delete m[t.dataset.delm];await liveSave(()=>saveMembers(m),"Access removed");return}
});
document.addEventListener("input",e=>{if(e.target.id==="ov-note"){L.draft[L.scProj+"_"+L.scMonth].note=e.target.value}
 if(e.target.classList.contains("ov-in")&&!e.target.classList.contains("pe-in")){const k=L.scProj+"_"+L.scMonth;L.draft[k][e.target.dataset.f][e.target.dataset.k]=e.target.value;clearTimeout(L.t);L.t=setTimeout(()=>{const pos=e.target.dataset.k;render();const el=document.querySelector(`.ov-in[data-k="${pos}"]`);if(el){el.focus();const v=el.value;el.value="";el.value=v}},600)}
 if(e.target.id==="acc-q"){L.acc.q=e.target.value;showHits(e.target.value)}});
document.addEventListener("focusin",e=>{if(e.target.id==="acc-q"&&!e.target.value)showHits("")});
document.addEventListener("change",e=>{if(e.target.id==="ip")st.ip=e.target.value;if(e.target.classList.contains("pe-in")){const v=e.target.dataset.t==="text"?e.target.value.trim():e.target.value===""?null:+e.target.value;liveSave(()=>L.db.doc("admin/projects").set({list:L.projects.map(p=>p.id===e.target.dataset.pid?{...p,[e.target.dataset.f]:v}:p)}),"Project updated")}if(e.target.id==="sc-proj"){L.scProj=e.target.value;render()}if(e.target.id==="sc-month"||e.target.id==="sc-month2"){if(e.target.value){L.scMonth=e.target.value;render()}}});

render();liveInit();
</script>
