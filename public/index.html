const SITES={Bahrain:["Muharraq Ring Road","Sitra Precast Yard","Hidd Logistics Hub"],KSA:["Jubail Industrial Yard","Dammam MEP Package","Riyadh Asphalt Plant"],Oman:["Duqm Port Works","Sohar Readymix Plant"],Qatar:["Lusail Landscapes","Mesaieed Plant Shutdown"],UAE:["Abu Dhabi Infrastructure Lot 3","Jebel Ali Sand Plant"]};
const COUNTRIES=["Bahrain","KSA","Oman","Qatar","UAE"];const CCOL=["var(--brand)","var(--info)","var(--accent)","var(--ok)","var(--warn)"];const CLEG=COUNTRIES.map((c,i)=>`<span><i style="background:${CCOL[i]}"></i>${c}</span>`).join("");

// seeded random for stable demo data
let s=7;const rnd=()=>{s=(s*16807)%2147483647;return (s-1)/2147483646};const pick=a=>a[Math.floor(rnd()*a.length)];
const ctys=["KSA","KSA","Bahrain","Bahrain","UAE","UAE","Qatar","Oman"];
const TODAY=new Date("2026-10-10");
const d=n=>{const x=new Date(TODAY);x.setDate(x.getDate()-n);return x};
const fmt=x=>x.toLocaleDateString("en-GB",{day:"2-digit",month:"short"});

const INC_T=[["Near Miss","Unsecured scaffold board fell 6 m into barricaded zone"],["First Aid","Hand laceration while cutting cable tray"],["Near Miss","Crane load swung near personnel during tag-line failure"],["Medical Treatment","Eye irritation from grinding without face shield"],["Property Damage","Forklift reversed into pipe rack support"],["Near Miss","Excavator struck unmarked LV cable"],["Lost Time","Worker slipped on jetty deck, fractured wrist"],["Near Miss","Gas test skipped before tank entry"],["First Aid","Heat stress symptoms during afternoon shift"],["Environmental","Hydraulic oil spill from boom lift, 15 L"],["Near Miss","Pressure line released during flange break"],["Medical Treatment","Foot crush by pipe spool during unloading"]];
const INCS=INC_T.map((t,i)=>{const c=pick(ctys);const wh=pick(WHEEL);const pf=["Near Miss","Lost Time"].includes(t[0])&&rnd()>.35;
 return{id:"INC-26-"+String(184-i*3).padStart(4,"0"),type:t[0],title:t[1],country:c,site:pick(SITES[c]),dept:pick(DEPTS.slice(0,11)),date:d(Math.floor(i*4.5+rnd()*3)),wheel:wh,pfpi:pf,
 status:i<3?"Under Investigation":i<5?"Actions Open":"Closed",by:pick(PEOPLE)}});
const OBS_T=["No harness tie-off at 4 m","Good housekeeping at laydown area","Expired fire extinguisher","Missing toe boards on scaffold","Toolbox talk well delivered","Damaged sling in use","Blocked emergency exit","Correct LOTO applied","Open trench without barricade","Worker without hearing protection","Spill kit missing at generator","Positive: tag lines used correctly"];
const OBS=[];for(let i=0;i<46;i++){const c=pick(ctys);const t=OBS_T[i%OBS_T.length];OBS.push({id:"OBS-"+(5320-i),title:t,kind:/Good|well|Correct|Positive/.test(t)?"Positive":rnd()>.5?"Unsafe Condition":"Unsafe Act",country:c,site:pick(SITES[c]),dept:pick(DEPTS),date:d(Math.floor(i*.7)),status:rnd()>.3?"Closed":"Open",by:pick(PEOPLE)})}
const CA_T=["Re-brief scaffold team on board securing","Install edge protection on level 3","Replace damaged slings and inspect rigging store","Update excavation permit with GPR scan","Provide face shields at grinding stations","Add spotter for forklift reversing","Heat stress plan: water and shade every 200 m","Calibrate gas detectors","Review LOTO procedure with mechanical crew","Anti-slip coating on jetty deck"];
const CAPA=CA_T.map((t,i)=>{const due=d(18-i*4);const st=i%4===0?"Closed":due<TODAY?"Overdue":"Open";return{id:"CA-"+(910+i),title:t,src:INCS[i%INCS.length].id,owner:pick(PEOPLE),dept:pick(DEPTS),country:INCS[i%INCS.length].country,due,status:st,kind:i%3===0?"Preventive":"Corrective"}});

const st={role:"mgr",view:(location.pathname.startsWith("/dashboard")||/[?&]dashboard/.test(location.search)?"exec":"hub"),country:"",sel:null,w:{step:0}};
const f=a=>a.filter(x=>!st.country||x.country===st.country);
const pillFor=s=>({"Closed":"p-ok","Open":"p-warn","Overdue":"p-crit","Under Investigation":"p-info","Actions Open":"p-warn"}[s]||"p-mute");
const typeColor=t=>({"Lost Time":"var(--crit)","Medical Treatment":"var(--crit)","First Aid":"var(--warn)","Near Miss":"var(--info)","Property Damage":"var(--warn)","Environmental":"var(--ok)"}[t]);

const IC_CAPA=IC.capa;Object.assign(IC,{
ncr:'<circle cx="12" cy="12" r="10"/><path d="M4.9 4.9l14.2 14.2"/>',
insp:'<path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 14l2 2 4-4"/>',
moc:'<path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
live:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',sc:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',entry:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',lactions:IC_CAPA,settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',exec:IC.dash,leaders:'<path d="M12 15l-3.5 2 1-4-3-2.7 4-.3L12 6l1.5 4 4 .3-3 2.7 1 4z"/>',activity:'<path d="M8 2v4M16 2v4"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/>',access:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',soon:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'});
const SOON={
audit:["Audits & Assessments","Plan internal, client and ISO 45001 / 14001 audits, record findings by clause, and turn each finding into a tracked action.",["Annual audit programme per country","Clause-based protocols (ISO 45001, 14001, client specs)","Findings graded Major / Minor / OFI","Auto-link findings to CAPA","Auditor competency register"]],
risk:["Risk Register & Bowtie","Hold every site's hazards in one register, score them on a 5×5 matrix, and draw threats, barriers and consequences as a bowtie.",["5×5 matrix with residual risk","Bowtie: threats, barriers, consequences","Barrier health from inspection results","JSA / task risk assessment library","Review reminders on changed conditions"]],
ptw:["Permit to Work","Issue, approve and close permits for high-risk work from a phone, with isolation and gas test records attached.",["Hot work, confined space, height, excavation, electrical","Isolation (LOTO) certificates","Gas test log with readings","Simultaneous operations conflict check","Permit board per site"]],
env:["Environmental & ESG","Track waste, spills, water, energy and emissions per site, and roll them up into ESG reporting.",["Waste manifest tracking","Spill register with volumes","Energy, water and fuel per site","CO₂e calculation","Monthly environmental report"]],
comp:["Compliance Register","List the legal and client requirements that apply in Bahrain, KSA, Oman, Qatar and UAE, and record evidence that each is met.",["GCC labour and OSH regulations per country","Client HSE specifications per contract","Evaluation of compliance every 6 months","Evidence attachments","Expiry alerts for licences and certificates"]],
train:["Training & Competency","Record inductions, courses and certificates for 2,000 employees and warn before anything expires.",["Training matrix by role and department","Certificate expiry alerts","Induction and toolbox talk attendance","Competency sign-off for critical roles","Training hours KPI"]],
sugg:["Improvement Suggestions","Let anyone submit an idea, route it to the right department, and show what was done with it.",["Submit from phone with photo","Department review and decision","Recognition and points","Link to MOC when a change is approved"]],
emer:["Emergency Preparedness","Keep emergency plans, contacts and drill records per site, and measure drill performance.",["Emergency response plan per site","Drill schedule and evaluation","Muster time tracking","Emergency equipment inspections","Contact lists by site"]]};
const NAV_M=[["#Live system"],["exec","Global HSSE dashboard"],["hdata","Enter HSSE data"],["leaders","Leadership engagement"],["live","Live reports"],["sc","Project score card"],["lactions","Live actions"],["activity","Activity log"],["entry","Admin review"],["access","Projects & access"],["settings","Structure & settings"],["#Report & investigate"],["inc","Incidents"],["obs","Observations"],["ncr","Non-Conformance"],["capa","Actions (CAPA)"],["#Assure"],["insp","Inspections"],["audit","Audits",1],["comp","Compliance",1],["#Control risk"],["risk","Risk & Bowtie",1],["moc","Management of Change"],["ptw","Permit to Work",1],["#People & environment"],["train","Training",1],["env","Environment & ESG",1],["emer","Emergency",1],["sugg","Suggestions",1],["#Platform"],["mod","All Modules"]];
const NAV_W=[["home","Home"],["live","Reports"],["lactions","Actions"]];
const TITLES={dash:"HSE Performance",inc:"Incidents & Near Misses",obs:"Observations",capa:"Corrective & Preventive Actions",mod:"Modules",home:"Report from Site",incd:"Incident Investigation",report:"New Report",ncr:"Non-Conformance Reports",ncrd:"Non-Conformance",insp:"Inspections",inspd:"Inspection",moc:"Management of Change",mocd:"Change Request",live:"Live Reports",sc:"Project Score Card",entry:"Score Card Admin Review",lactions:"Live Actions",exec:"Global HSSE Dashboard",hub:"Home",hdata:"Enter HSSE Data",settings:"Structure & Settings",leaders:"Leadership Engagement",activity:"Activity Log",access:"Projects & Access"};
const PARENT={incd:"inc",report:"home",ncrd:"ncr",inspd:"insp",mocd:"moc"};

function nav(){const L=st.role==="mgr"?NAV_M:NAV_W;const cur=PARENT[st.view]||st.view;
 const b=([k,l,soon])=>k[0]==="#"?`<div class="sec">${k.slice(1)}</div>`:`<button data-go="${k}" aria-current="${cur===k}">${svg(IC[k]?k:"soon")}<span>${l}</span>${soon?'<span class="soon">PH2</span>':""}</button>`;
 document.getElementById("sidenav").innerHTML=(st.role==="mgr"?"":`<div class="sec">Site</div>`)+L.map(b).join("");
 const T=st.role==="mgr"?[["hub","Home"],["live","Reports"],["lactions","Actions"],["sc","Score card"],["hdata","Data"]]:NAV_W;
 document.getElementById("tabbar").innerHTML=T.map(b).join("");}

/* ---------- NCR ---------- */
const NCR_T=[["Excavation without shoring beyond 1.2 m","Excavation & Trenching Procedure §4.2","Client","Major"],["Scaffold tags not updated after modification","Scaffolding Procedure §6.3","Internal audit","Minor"],["Lifting plan not approved for 40 t lift","Lifting Operations Procedure §5.1","Client","Major"],["Waste segregation not maintained at laydown","Waste Management Plan §3.4","Environmental inspection","Minor"],["Subcontractor workers without induction","HSE Induction Procedure §2.2","Internal audit","Major"],["Fire watch absent during hot work","Hot Work Permit Procedure §7","Client","Major"],["First aid box contents incomplete","First Aid Procedure §4","Site inspection","Minor"],["Gas detector calibration overdue","Confined Space Procedure §8.1","Internal audit","Minor"]];
const NCR_FLOW=["Raised","Accepted","Root cause","Action plan","Verification","Closed"];
const NCRS=NCR_T.map((t,i)=>{const c=pick(ctys);return{id:"NCR-26-"+String(47-i).padStart(3,"0"),title:t[0],ref:t[1],src:t[2],grade:t[3],country:c,site:pick(SITES[c]),dept:pick(["Civil","Construction","Mechanical","Logistics","HSE","Electrical"]),date:d(i*6+2),stage:[1,2,3,4,5,5,3,2][i],raisedBy:t[2]==="Client"?"Client HSE Rep.":pick(PEOPLE),owner:pick(PEOPLE)}});
function flow(stages,cur){return`<div class="flow">${stages.map((s,i)=>`<div class="${i<cur?"done":i===cur?"cur":""}"><b>${String(i+1).padStart(2,"0")}</b>${s}</div>`).join("")}</div>`}
const ncrStatus=x=>x.stage>=5?"Closed":x.date<d(25)?"Overdue":"Open";
function ncr(){const N=f(NCRS);
 return demoTag+`<div class="kpis"><div class="kpi"><span class="l">Open NCRs</span><span class="v">${N.filter(x=>x.stage<5).length}</span></div><div class="kpi"><span class="l">Major</span><span class="v">${N.filter(x=>x.grade==="Major").length}</span></div><div class="kpi"><span class="l">Raised by client</span><span class="v">${N.filter(x=>x.src==="Client").length}</span></div><div class="kpi ${N.some(x=>ncrStatus(x)==="Overdue")?"alert":""}"><span class="l">Overdue (&gt;25 days)</span><span class="v">${N.filter(x=>ncrStatus(x)==="Overdue").length}</span></div></div>
 <div class="filters"><button class="btn acc" id="ncr-new">+ Raise NCR</button></div>
 <div class="panel"><div class="tbl"><table><thead><tr><th>ID</th><th>Non-conformance</th><th>Grade</th><th class="hide-m">Source</th><th class="hide-m">Site</th><th>Stage</th><th>Status</th></tr></thead><tbody>
 ${N.map(x=>`<tr class="click" data-ncr="${x.id}"><td class="id">${x.id}</td><td>${x.title}<br><small style="color:var(--muted)">${x.ref}</small></td><td><span class="pill ${x.grade==="Major"?"p-crit":"p-warn"}">${x.grade}</span></td><td class="hide-m">${x.src}</td><td class="hide-m">${x.site}<br><small style="color:var(--muted)">${x.country}</small></td><td>${NCR_FLOW[x.stage]}</td><td><span class="pill ${pillFor(ncrStatus(x))}">${ncrStatus(x)}</span></td></tr>`).join("")}</tbody></table></div></div>`;}
function ncrd(){const x=NCRS.find(n=>n.id===st.sel);
 const nextLabel=["Accept NCR","Submit root cause","Submit action plan","Request verification","Verify & close"][x.stage];
 return`<div><button class="btn" data-go="ncr">← Back to NCRs</button></div>
 <div class="panel"><div class="det-head"><div><span class="id">${x.id}</span><h2>${x.title}</h2><span class="pill ${x.grade==="Major"?"p-crit":"p-warn"}">${x.grade}</span> <span class="pill ${pillFor(ncrStatus(x))}">${ncrStatus(x)}</span></div>${x.stage<5?`<button class="btn acc" id="ncr-adv">${nextLabel}</button>`:""}</div>
 ${flow(NCR_FLOW,x.stage)}
 <div class="facts"><div><span>Requirement</span>${x.ref}</div><div><span>Source</span>${x.src}</div><div><span>Raised by</span>${x.raisedBy}</div><div><span>Site</span>${x.site}, ${x.country}</div><div><span>Department</span>${x.dept}</div><div><span>Owner</span>${x.owner}</div></div></div>
 <div class="grid2"><div class="panel"><h2>Root cause <small>5-Why</small></h2>${x.stage>=2?`<ol class="seq"><li>Requirement not met at point of work.</li><li>Supervisor did not verify before start.</li><li>Pre-start checklist does not include this item.</li><li>Procedure revision not cascaded to subcontractor.</li><li>No briefing step in the document change process.</li></ol>`:`<div style="color:var(--muted)">Opens once the NCR is accepted.</div>`}</div>
 <div class="panel"><h2>Audit trail</h2><div class="trail">${NCR_FLOW.slice(0,x.stage+1).map((s,i)=>`<div><span>${s}</span> · ${i===0?x.raisedBy:x.owner} · ${fmt(d(Math.max(0,(TODAY-x.date)/864e5-i*2)))}</div>`).join("")}</div></div></div>
 <div class="panel"><h2>Linked actions</h2><div class="links"><span class="pill p-warn">CA-${930+NCRS.indexOf(x)} Correct at site</span><span class="pill p-info">PA-${950+NCRS.indexOf(x)} Update pre-start checklist</span><span class="pill p-mute">Evidence: 3 photos</span></div></div>`;}

/* ---------- Inspections ---------- */
const TEMPLATES={"Scaffolding":["Base plates and sole boards in place","Guardrails and toe boards fitted","Green tag valid and signed","Access ladder secured","Platform fully boarded","No overloading of materials"],
"Lifting equipment":["Third-party certificate valid","Slings and shackles colour-coded","Load chart available in cab","Outriggers on mats","Exclusion zone barricaded","Banksman competent and identified"],
"Critical controls":["Permit in place and signed at point of work","Isolations verified and locked","Gas test recorded before entry","Edge protection or harness tie-off in use","Lifting exclusion zone enforced","Rescue plan and standby person present"],
"Housekeeping":["Walkways clear","Materials stacked safely","Waste bins segregated","Spill kit available","Lighting adequate","Emergency exits unobstructed"],
"Fire safety":["Extinguishers inspected this month","Fire points signed","Hot work area clear of combustibles","Fire watch present","Alarm call points accessible","Assembly point marked"]};
const INSPS=[];Object.keys(TEMPLATES).forEach((t,ti)=>{for(let k=0;k<3;k++){const c=pick(ctys);const sc=Math.round(70+rnd()*30);INSPS.push({id:"INS-"+(2210-ti*3-k),tpl:t,country:c,site:pick(SITES[c]),dept:pick(DEPTS.slice(0,10)),by:pick(PEOPLE),date:d(ti*2+k*5),score:sc,findings:sc<100?Math.ceil((100-sc)/8):0})}});
function insp(){const I=f(INSPS);const avg=Math.round(I.reduce((a,x)=>a+x.score,0)/(I.length||1));
 return demoTag+`<div class="kpis"><div class="kpi"><span class="l">Inspections (30 days)</span><span class="v">${I.length}</span></div><div class="kpi"><span class="l">Average score</span><span class="v">${avg}%</span></div><div class="kpi"><span class="l">Findings raised</span><span class="v">${I.reduce((a,x)=>a+x.findings,0)}</span></div><div class="kpi"><span class="l">Templates</span><span class="v">${Object.keys(TEMPLATES).length}</span><span class="d">editable by HSE admin</span></div></div>
 <div class="panel"><h2>Start an inspection</h2><div class="filters">${Object.keys(TEMPLATES).map(t=>`<button class="btn pri" data-tpl="${t}">${t}</button>`).join("")}</div></div>
 <div class="panel"><div class="tbl"><table><thead><tr><th>ID</th><th>Checklist</th><th class="hide-m">Site</th><th class="hide-m">Inspector</th><th>Date</th><th>Score</th><th>Findings</th></tr></thead><tbody>
 ${I.map(x=>`<tr><td class="id">${x.id}</td><td>${x.tpl}</td><td class="hide-m">${x.site}<br><small style="color:var(--muted)">${x.country}</small></td><td class="hide-m">${x.by}</td><td class="id">${fmt(x.date)}</td><td><span class="pill ${x.score>=90?"p-ok":x.score>=80?"p-warn":"p-crit"}">${x.score}%</span></td><td>${x.findings}</td></tr>`).join("")}</tbody></table></div></div>`;}
function inspd(){const q=TEMPLATES[st.tpl];const a=st.ans;const yes=q.filter((_,i)=>a[i]==="y").length;
 const denom=q.filter((_,i)=>a[i]==="y"||a[i]==="n").length;const score=denom?Math.round(yes/denom*100):null;const fails=q.filter((_,i)=>a[i]==="n").length;
 return`<div><button class="btn" data-go="insp">← Back to inspections</button></div>
 <div class="grid2"><div class="panel"><h2>${st.tpl} checklist <small>${Object.keys(a).length} of ${q.length} answered</small></h2>
 ${q.map((t,i)=>`<div class="ck"><span>${t}</span><span class="opt"><button class="y" data-ck="${i}" data-v="y" aria-pressed="${a[i]==="y"}">Yes</button><button class="n" data-ck="${i}" data-v="n" aria-pressed="${a[i]==="n"}">No</button><button class="na" data-ck="${i}" data-v="na" aria-pressed="${a[i]==="na"}">N/A</button></span></div>`).join("")}</div>
 <div class="panel"><h2>Result</h2><div class="score" style="color:${score===null?"var(--muted)":score>=90?"var(--ok)":score>=80?"var(--warn)":"var(--crit)"}">${score===null?"—":score+"%"}</div>
 <div style="color:var(--muted)">${score===null?"Answer the checklist to see the score.":fails?fails+" item"+(fails>1?"s":"")+" failed. Each one becomes a finding with an owner and due date when you submit.":"All answered items compliant."}</div>
 ${L.ready&&myProjects().length?`<div class="fld"><label for="ip">Project</label><select id="ip">${myProjects().map(p=>`<option value="${esc(p.id)}" ${st.ip===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select></div>`:""}<button class="btn acc" id="insp-sub" ${Object.keys(a).length<q.length?"disabled":""}>Submit inspection</button></div></div>`;}

function vbars(vals,labels,{h=150,color="var(--brand)",fmt=v=>v,target,attr}={}){const W=Math.max(320,labels.length*44),mx=Math.max(...vals,target||0)*1.15||1,bw=W/vals.length;
 return`<div class="tbl"><svg viewBox="0 0 ${W} ${h+34}" width="100%" style="min-width:${Math.min(W,560)}px" role="img">
 ${[0,.5,1].map(g=>`<line x1="0" x2="${W}" y1="${h-g*h/1.15+10}" y2="${h-g*h/1.15+10}" stroke="var(--line)"/>`).join("")}
 ${vals.map((v,i)=>{const bh=v/mx*h;const at=attr?attr(v,i):"";return`<g ${at} ${at?'class="hot"':""}><title>${labels[i]}: ${fmt(v)}${at?" · click for details":""}</title><rect x="${i*bw}" y="10" width="${bw}" height="${h}" fill="transparent"/><rect x="${i*bw+bw*.2}" y="${h-bh+10}" width="${bw*.6}" height="${bh}" rx="2" fill="${typeof color==="function"?color(v,i):color}"/></g><text x="${i*bw+bw/2}" y="${h-bh+4}" text-anchor="middle" font-size="10" fill="var(--fg)" font-family="IBM Plex Mono,monospace">${fmt(v)}</text><text x="${i*bw+bw/2}" y="${h+26}" text-anchor="middle" font-size="10" fill="var(--muted)">${labels[i]}</text>`}).join("")}
 ${target?`<line x1="0" x2="${W}" y1="${h-target/mx*h+10}" y2="${h-target/mx*h+10}" stroke="var(--crit)" stroke-dasharray="4 4"/><text x="${W-4}" y="${h-target/mx*h+6}" text-anchor="end" font-size="10" fill="var(--crit)">Target ${target}</text>`:""}</svg></div>`;}
function line(series,labels,{h=150,target,dec=2}={}){const W=560,all=series.flatMap(s=>s.v).concat(target||0),mx=Math.max(...all)*1.2||1,x=i=>20+i*(W-40)/(labels.length-1),y=v=>h-v/mx*(h-14)+4;
 return`<div class="tbl"><svg viewBox="0 0 ${W} ${h+28}" width="100%" style="min-width:420px" role="img">
 ${[0,.5,1].map(g=>`<line x1="20" x2="${W-20}" y1="${y(g*mx/1.2)}" y2="${y(g*mx/1.2)}" stroke="var(--line)"/><text x="16" y="${y(g*mx/1.2)+3}" text-anchor="end" font-size="9" fill="var(--muted)">${(g*mx/1.2).toFixed(dec)}</text>`).join("")}
 ${target!==undefined?`<rect x="20" y="${y(target)}" width="${W-40}" height="${h+4-y(target)}" fill="var(--ok)" opacity=".12"/><line x1="20" x2="${W-20}" y1="${y(target)}" y2="${y(target)}" stroke="var(--ok)" stroke-dasharray="4 4"/>`:""}
 ${series.map(s=>`<polyline fill="none" stroke="${s.c}" stroke-width="2.2" points="${s.v.map((v,i)=>x(i)+","+y(v)).join(" ")}"/>${s.v.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===s.v.length-1?4:2.5}" fill="${s.c}"><title>${labels[i]}: ${v}</title></circle>`).join("")}<text x="${x(s.v.length-1)}" y="${y(s.v[s.v.length-1])-8}" text-anchor="middle" font-size="10" font-weight="600" fill="${s.c}">${s.v[s.v.length-1].toFixed?s.v[s.v.length-1].toFixed(dec):s.v[s.v.length-1]}</text>`).join("")}
 ${labels.map((l,i)=>`<text x="${x(i)}" y="${h+22}" text-anchor="middle" font-size="10" fill="var(--muted)">${l}</text>`).join("")}</svg></div>`;}
function donut(parts,center,sub,attr){let a=-Math.PI/2;const tot=parts.reduce((s,p)=>s+p[1],0)||1;const R=54,r=36;
 const arcs=parts.map(([n,v,c])=>{const b=a+v/tot*Math.PI*2;const p=(ang,rr)=>[70+rr*Math.cos(ang),70+rr*Math.sin(ang)];const L=b-a>Math.PI?1:0;const[x1,y1]=p(a,R),[x2,y2]=p(b,R),[x3,y3]=p(b,r),[x4,y4]=p(a,r);const d=`M${x1},${y1}A${R},${R} 0 ${L} 1 ${x2},${y2}L${x3},${y3}A${r},${r} 0 ${L} 0 ${x4},${y4}Z`;a=b;const at=attr?attr(n):"";return v?`<path d="${d}" fill="${c}" ${at} ${at?'class="hot"':""}><title>${n}: ${v} (${Math.round(v/tot*100)}%)</title></path>`:""}).join("");
 const depth=arcs.replace(/ data-[a-z]+="[^"]*"/g,"").replace(/class="hot"/g,"").replace(/<title>.*?<\/title>/g,"");
 return`<div class="dn"><svg viewBox="0 0 140 140" width="140" height="140"><g transform="translate(0,15) scale(1,.76)"><g transform="translate(0,11)" style="filter:brightness(.6)">${depth}</g>${arcs}</g><text x="70" y="72" text-anchor="middle" font-size="${String(center).length>5?17:22}" font-weight="600" fill="var(--fg)" font-family="Barlow Condensed,sans-serif">${center}</text><text x="70" y="88" text-anchor="middle" font-size="9" fill="var(--muted)">${sub}</text></svg><div class="dl">${parts.map(([n,v,c])=>{const at=attr?attr(n):"";return`<span ${at} ${at?'class="hot"':""}><i style="background:${c}"></i>${n}<b>${v}</b></span>`}).join("")}</div></div>`;}
function pyramid(items,lagN){const PYR=items||window.PYR_DEMO,LAG=lagN||7,n=PYR.length,rh=30,gap=4,W=320,cx=W/2+8,lx=W+44,H=n*(rh+gap)-gap,yb=LAG*(rh+gap)-gap/2;
 const hw=y=>y<=yb?(W/2)*y/yb:(W/2)*(H-y)/(H-yb);
 const rows=PYR.map(([l,v],i)=>{const y0=i*(rh+gap),y1=y0+rh,ym=y0+rh/2,lag=i<LAG;const a=hw(y0),b=hw(y1),wm=hw(ym);
  const shade=lag?.45+.55*(i+1)/LAG:.45+.55*(n-i)/(n-LAG);const fill=lag?"var(--crit)":"var(--ok)";const inside=wm*2>58;
  const dk=PYR[i][2];return(dk?`<g class="hot" data-drill="${dk}"><title>${l}: ${v} · click for details</title>`:`<g><title>${l}: ${v}</title>`)+`<rect x="0" y="${y0}" width="${lx+190}" height="${rh}" fill="transparent"/><polygon points="${cx-a},${y0} ${cx+a},${y0} ${cx+b},${y1} ${cx-b},${y1}" fill="${fill}" fill-opacity="${shade.toFixed(2)}"/>`+
  `<line x1="${cx+Math.max(a,b)+(inside?6:18+v.toLocaleString().length*8.5)}" y1="${ym}" x2="${lx-8}" y2="${ym}" stroke="var(--line)" stroke-width="1"/>`+
  `<text x="${inside?cx:cx+Math.max(a,b)+10}" y="${ym+4.5}" text-anchor="${inside?"middle":"start"}" font-size="13" font-weight="700" font-family="IBM Plex Mono,monospace" fill="${inside?"#ffffff":"var(--fg)"}">${v.toLocaleString()}</text>`+
  `<text x="${lx}" y="${ym+4.5}" font-size="13" fill="var(--fg)">${l}</text></g>`}).join("");
 const div=`<line x1="${cx-W/2-4}" y1="${yb}" x2="${cx+W/2+4}" y2="${yb}" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
 return`<div class="tbl"><svg viewBox="0 0 ${lx+190} ${H+4}" width="100%" style="min-width:440px" role="img" aria-label="Safety diamond: lagging indicators above, leading indicators below">${rows}${div}
 <text x="4" y="14" font-size="11" font-weight="600" letter-spacing="1" fill="var(--crit)">LAGGING</text><text x="4" y="${H-2}" font-size="11" font-weight="600" letter-spacing="1" fill="var(--ok)">LEADING</text></svg></div>`;}

async function fillNames(){if(!L.user)return;const els=[...document.querySelectorAll(".uname[data-uid]")];const ids=[...new Set(els.map(e=>e.dataset.uid).filter(Boolean))];if(!ids.length)return;
 const ps=await L.user.profiles(ids);els.forEach(e=>{const p=ps[e.dataset.uid];e.textContent=p?.isMe?(p.name||"you")+" (you)":(p?.name||"Someone")})}
async function showHits(q){const box=document.getElementById("acc-hits");if(!box)return;const hits=await L.user.search(q);box.replaceChildren(...hits.slice(0,6).map(h=>{const d=document.createElement("div");const s=document.createElement("span");s.textContent=h.name+(h.isMe?" (you)":"");const b=document.createElement("button");b.className="btn";b.textContent="Select";b.dataset.pick=h.id;d.append(s,b);return d}))}
async function saveMembers(map){await L.db.doc("admin/members").set({map})}
async function liveSave(fn,ok){try{await fn();if(ok)toast(ok);return true}catch(e){toast(e?.code==="invalid_argument"?"You do not have permission to save this. Ask your HSE Admin to add you to this project.":e?.code==="quota_exceeded"?"Storage is full. Remove old records and try again.":"Could not save. Check your connection and try again.");return false}}

 if(t.id==="mic"){toggleMic();return}
 if(t.id==="ai-run"){runAI();return}
 if(t.id==="ai-cat"){st.w.cat=st.w.ai.category;render();return}

 if(t.dataset.photo){openPhoto(t.dataset.photo);return}
 if(t.dataset.close){const r=L.reports.find(x=>x.id===t.dataset.close);await liveSave(()=>L.db.doc("reports/"+r.id).update({status:r.status==="Closed"?"Open":"Closed"}));return}
 if(t.dataset.q!==undefined){const k=L.scProj+"_"+L.scMonth;L.draft[k].qual[+t.dataset.q]=+t.dataset.v;render();return}
 if(t.id==="rv-save"){const k=L.scProj+"_"+L.scMonth;const d=L.draft[k];const ov=Object.fromEntries(Object.entries(d.override).filter(([,v])=>v!==""&&v!=null).map(([a,v])=>[a,+v]));
  if(Object.keys(ov).length&&!d.note.trim()){toast("Write a reason for the overrides first");return}
  await liveSave(()=>L.db.collection("admin/rv/months").doc(k).set({override:ov,admin:Object.fromEntries(Object.entries(d.admin).filter(([,v])=>v!==""&&v!=null).map(([a,v])=>[a,+v])),qual:d.qual,note:d.note.trim(),by:L.me.id,ts:Date.now()}),"Review saved");delete L.draft[k];return}
 if(t.dataset.ract){const r=L.reports.find(x=>x.id===t.dataset.ract);L.af={report:r.id,project:r.project,title:"Follow up: "+(r.desc||r.kind||r.rt).slice(0,80)};go("lactions");return}
 if(t.id==="af-add"){const g=id=>document.getElementById(id).value;const title=g("af-title").trim();if(!title){toast("Describe the action first");return}const due=g("af-due");
  await liveSave(()=>L.db.collection("actions").add({title,project:g("af-proj"),owner:g("af-owner").trim(),due:due?new Date(due+"T23:59").getTime():null,priority:g("af-pri"),report:L.af.report||null,ts:Date.now(),by:L.me.id,closedAt:null}),"Action added");L.af={};return}
 if(t.dataset.aclose){const a=L.actions.find(x=>x.id===t.dataset.aclose);await liveSave(()=>L.db.doc("actions/"+a.id).update({closedAt:a.closedAt?null:Date.now()}));return}
 if(t.id==="lv-add"){const g=id=>document.getElementById(id).value;await liveSave(()=>L.db.collection("activities").add({type:g("lv-type"),project:g("lv-proj"),date:new Date(g("lv-date")+"T12:00").getTime(),count:Math.max(1,+g("lv-count")||1),by:L.me.id,ts:Date.now()}),"Logged");return}
 if(t.dataset.sdel){delP(L.sdraft,t.dataset.sdel);render();return}
 if(t.dataset.sadd){const k=t.dataset.sadd;if(k==="countries"){const v=(document.getElementById("st-newc").value||"").trim();if(!v){toast("Type a country name first");return}if(!L.sdraft.countries.includes(v))L.sdraft.countries.push(v)}
  else if(k==="platforms")L.sdraft.platforms.push({name:"New platform",businesses:[],_o:null});else if(k.endsWith(".businesses"))getP(L.sdraft,k).push({name:"New business",clusters:[],_o:null});else getP(L.sdraft,k).push({name:"New cluster",_o:null});render();return}
 if(t.id==="st-save"){await saveStructure();return}
 if(t.id==="st-reset"){L.sdraft=null;render();return}
 if(t.id==="demo-load"){t.disabled=true;t.textContent="Loading…";await loadDemo();return}
 if(t.id==="demo-remove"){if(t.dataset.confirm!=="1"){t.dataset.confirm="1";t.textContent="Confirm: remove all demo projects and their records";return}await liveSave(()=>L.db.removeDemo(),"Demo data removed");return}
 if(t.dataset.lvl){st.lvl=JSON.parse(t.dataset.lvl);st.drill=null;render();window.scrollTo(0,0);return}
 if(t.dataset.scd2){go("sc");st.scd=t.dataset.scd2;render();return}
 if(t.dataset.scd){st.scd=t.dataset.scd;render();return}
 if(t.id==="scd-back"){st.scd=null;render();return}
 if(t.id==="np-add"){const n=document.getElementById("np-name").value.trim();if(!n){toast("Type a project name first");return}const c=document.getElementById("np-cty").value;
  const id="p"+Date.now().toString(36);const pl=document.getElementById("np-plat").value,dv=document.getElementById("np-div").value,cl=(document.getElementById("np-clu")||{}).value||"";if(!dv){toast("Choose the business first");return}await liveSave(()=>L.db.doc("admin/projects").set({list:[...L.projects,{id,name:n,country:c,platform:pl,division:dv,cluster:cl}]}),"Project added");L.np={plat:pl};return}
 if(t.dataset.delp){if(t.dataset.confirm!=="1"){t.dataset.confirm="1";t.textContent="Confirm remove";return}await liveSave(()=>L.db.doc("admin/projects").set({list:L.projects.filter(p=>p.id!==t.dataset.delp)}),"Project removed");return}
 if(t.dataset.pick){L.acc.pick=t.dataset.pick;const ex=L.members[t.dataset.pick];L.acc.role=ex?.role||null;L.acc.leader=!!ex?.leader;L.acc.walkTarget=ex?.walkTarget??"";L.acc.projects=[...(ex?.projects||[])];render();return}
 if(t.dataset.role){L.acc.role=t.dataset.role;render();return}
 if(t.dataset.pp){const s=new Set(L.acc.projects||[]);s.has(t.dataset.pp)?s.delete(t.dataset.pp):s.add(t.dataset.pp);L.acc.projects=[...s];render();return}
 if(t.dataset.lead!==undefined){const wt=document.getElementById("acc-wt");if(wt)L.acc.walkTarget=wt.value;L.acc.leader=t.dataset.lead==="1";render();return}
 if(t.id==="acc-save"){const a=L.acc;const wt=document.getElementById("acc-wt");if(wt)a.walkTarget=wt.value;await liveSave(()=>saveMembers({...L.members,[a.pick]:{role:a.role,projects:a.role==="admin"?[]:a.projects,leader:!!a.leader,walkTarget:a.leader&&a.walkTarget!==""&&a.walkTarget!=null?+a.walkTarget:null}}),"Access saved");L.acc={q:"",hits:[],pick:null};return}
 if(t.dataset.edm){const m=L.members[t.dataset.edm];L.acc={q:"",pick:t.dataset.edm,role:m.role,projects:[...(m.projects||[])],leader:!!m.leader,walkTarget:m.walkTarget??""};render();window.scrollTo(0,0);return}
 if(t.dataset.delm){if(t.dataset.confirm!=="1"){t.dataset.confirm="1";t.textContent="Confirm";return}const m={...L.members};delete m[t.dataset.delm];await liveSave(()=>saveMembers(m),"Access removed");return}
});
document.addEventListener("click",e=>{const t=e.target.closest("[data-drill],[data-setm],[data-lvlj],[data-ctry],#drill-close,[data-export],[data-etab],#ai-outlook");if(!t)return;
 if(t.dataset.etab){st.etab=t.dataset.etab;st.drill=null;render();return}

 if(t.id==="drill-close"){st.drill=null;render();return}
 if(t.dataset.drill){st.drill=st.drill===t.dataset.drill?null:t.dataset.drill;render();return}

document.addEventListener("input",e=>{if(e.target.classList.contains("st-in")){setP(L.sdraft,e.target.dataset.path,e.target.value);return}if(e.target.id==="ov-note"){L.draft[L.scProj+"_"+L.scMonth].note=e.target.value}
 if(e.target.classList.contains("ov-in")&&!e.target.classList.contains("pe-in")){const k=L.scProj+"_"+L.scMonth;L.draft[k][e.target.dataset.f][e.target.dataset.k]=e.target.value;clearTimeout(L.t);L.t=setTimeout(()=>{const pos=e.target.dataset.k;render();const el=document.querySelector(`.ov-in[data-k="${pos}"]`);if(el){el.focus();const v=el.value;el.value="";el.value=v}},600)}

/* ---- Branding: name, tagline and logo, editable by the HSE Admin ---- */
const NAVO_MARK=`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 3 L56 12 V30 C56 45 46 56 32 61 C18 56 8 45 8 30 V12 Z" fill="#1FA37A" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><path d="M32 4.5 L55 13 V30 C55 44 45.5 54.5 32 59.5 Z" fill="#0B4F3C" opacity=".35"/><circle cx="32" cy="32" r="14.5" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M32 16 L38.5 33 L32 29.5 L25.5 33 Z" fill="#F5B82E"/><path d="M32 48 L25.5 31 L32 34.5 L38.5 31 Z" fill="#fff"/><circle cx="32" cy="32" r="2.6" fill="#0B4F3C"/></svg>`;
function brand(){const b=(L.structure&&L.structure.brand)||{};return{name:b.name||"NAVO",tag:b.tag??"HSE Platform",logo:b.logo||"",hide:!!b.hide}}
function applyBrand(){const b=brand();document.querySelectorAll(".brand-name").forEach(e=>e.textContent=b.name);document.querySelectorAll(".brand-tag").forEach(e=>e.textContent=b.tag);
 document.querySelectorAll(".logo-mark").forEach(e=>e.innerHTML=b.hide?"":b.logo?`<img src="${b.logo}" alt="">`:NAVO_MARK);document.title=b.name+" HSE";}
function brandPanel(){const b=L.bdraft||(L.bdraft={...brand()});
 return`<div class="panel"><h2>Name & logo <small>shown on every page, the login screen and the dashboard</small></h2>
 <div class="brand-ed"><div class="brand-prev">${b.hide?`<span class="brand-none">No logo</span>`:b.logo?`<img src="${b.logo}" alt="Logo">`:NAVO_MARK}</div>
 <div class="hd-grid" style="flex:1"><div class="fld"><label for="br-name">System name</label><input id="br-name" class="br-in" data-k="name" type="text" maxlength="30" value="${esc(b.name)}"></div><div class="fld"><label for="br-tag">Tagline</label><input id="br-tag" class="br-in" data-k="tag" type="text" maxlength="40" value="${esc(b.tag)}"></div></div></div>
 <div class="filters" style="margin-top:10px"><label class="btn" for="br-file">Upload a logo</label><input id="br-file" type="file" accept="image/*" hidden><button class="btn" id="br-default">Use the NAVO logo</button><button class="btn" id="br-hide">Remove logo</button><button class="btn pri" id="br-save">Save name & logo</button></div>
 <p style="margin:6px 0 0;font-size:12px;color:var(--muted)">PNG or SVG with a transparent background looks best. It is resized to 256 px.</p></div>`}
document.addEventListener("input",e=>{const t=e.target;if(t.classList&&t.classList.contains("br-in")){(L.bdraft||(L.bdraft={...brand()}))[t.dataset.k]=t.value}});
document.addEventListener("change",e=>{const t=e.target;if(t.id!=="br-file"||!t.files[0])return;const f=t.files[0];const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const s=256,c=document.createElement("canvas"),k=Math.min(s/img.width,s/img.height,1);c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
 L.bdraft={...(L.bdraft||brand()),logo:c.toDataURL("image/png"),hide:false};render()};img.src=rd.result};rd.readAsDataURL(f)});
document.addEventListener("click",async e=>{const t=e.target.closest("#br-default,#br-hide,#br-save");if(!t)return;const b=L.bdraft||(L.bdraft={...brand()});
 if(t.id==="br-default"){b.logo="";b.hide=false;render();return}if(t.id==="br-hide"){b.hide=true;b.logo="";render();return}
 const s={...(L.structure||DEFAULT_STRUCT),brand:{name:(b.name||"NAVO").trim(),tag:(b.tag||"").trim(),logo:b.logo||"",hide:!!b.hide}};
 const ok=await liveSave(()=>L.db.doc("admin/structure").set(s),"Name & logo saved");if(ok!==false){L.structure=s;L.bdraft=null;applyBrand();render()}});
applyBrand();
